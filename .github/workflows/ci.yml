name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node skills/nativize/scripts/scan.mjs examples/habit-demo/src/AfterHome.tsx --min-score 90
      - run: python3 -m py_compile skills/nativize/scripts/compare.py
      - run: bash -n skills/nativize/scripts/capture.sh
